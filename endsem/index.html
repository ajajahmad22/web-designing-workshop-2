<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <h2>📚 Student Marks Calculator</h2>

        <input type="number" id="subjects" placeholder="Enter number of subjects">

        <button onclick="createInputs()">Enter Marks</button>

        <div id="marksBox"></div>

        <button onclick="calculateMarks()">Calculate Result</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
